# La página se publica desde la rama gh-pages (GitHub Pages › Deploy from a branch). Los cambios se hacen en main y se
# suben también a gh-pages (git push origin main:gh-pages); eso solo ya publica. Este botón vuelve a pedir la
# publicación por si alguna se atora. Se corre a mano desde Actions o con la API (workflow_dispatch).
name: Publicar la página

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a GitHub Pages que vuelva a publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
