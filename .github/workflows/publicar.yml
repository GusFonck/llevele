# Le pide a GitHub Pages que publique lo último de main. Hace falta porque los cambios que sube Claude no disparan
# solos la publicación (los de una persona sí). Se corre a mano desde Actions o con la API (workflow_dispatch).
name: Publicar la página

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a GitHub Pages que publique main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
